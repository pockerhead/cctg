# QA round 2 end-to-end harness for TASK-016 (independent of crates/cctg/tests/stream_e2e.rs).
# Not a workspace member.
[package]
name = "qa2016-e2e"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
cctg = { path = "../../../../../../../../crates/cctg" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync", "net"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
transcript = { path = "../../../../../../../../crates/transcript" }

[profile.dev]
debug = false
