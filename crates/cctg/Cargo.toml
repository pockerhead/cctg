[package]
name = "cctg"
version = "0.1.0"
edition.workspace = true

[dependencies]
anyhow.workspace = true
# sha256 of the cctg executable (TASK-040 build identity). Already built for
# rustls (reqwest) with these features; no new download.
aws-lc-rs = { version = "1.18", default-features = false, features = ["aws-lc-sys", "prebuilt-nasm"] }
# base64 of file chunks on the agent link (TASK-032). Already in the lock
# file through reqwest; no new download.
base64 = "0.23"
clap.workspace = true
dotenvy.workspace = true
reqwest.workspace = true
# TLS of the agent link and the hook endpoint (TASK-035). Both already in the
# lock file through reqwest, with the same aws-lc-rs provider.
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs"] }
serde.workspace = true
serde_json.workspace = true
# TCP keepalive on the agent link (TASK-049): neither std nor tokio sets its
# idle time. Already in the lock file through tokio; no new download.
socket2 = "0.6"
subtle.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-std", "io-util", "net", "process", "signal", "sync", "time"] }
tracing.workspace = true
tracing-subscriber.workspace = true
transcript = { path = "../transcript" }
# Screen copy of the terminal `cctg run` holds for claude on Linux and macOS
# (TASK-044). Pure Rust; built on every platform so its tests run everywhere.
vt100 = "0.16"

# The pseudo-terminal of `cctg run`, raw mode, signals, the macOS process
# walk (TASK-044); install_e2e's setsid. Already in the lock file through
# tokio; no new download.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Process snapshot for the hook's nesting check (CreateToolhelp32Snapshot);
# console key presses of the agent (TASK-029: AttachConsole, CreateFileW
# CONIN$, WriteConsoleInputW). The Win32_Security_*, JobObjects,
# StationsAndDesktops, RemoteDesktop, NetManagement, Registry, UI_Shell,
# Pipes, SystemServices, Environment, UI_WindowsAndMessaging and Wdk_* groups
# are the native Windows folder sandbox (TASK-089): restricted token, ACLs,
# job, private desktop, local accounts, DPAPI, the elevated install.
# Same 0.61 version; no new download.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Authentication_Identity",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
    "Win32_System_JobObjects",
    "Win32_System_StationsAndDesktops",
    "Win32_System_RemoteDesktop",
    "Win32_NetworkManagement_NetManagement",
    "Win32_System_Registry",
    "Win32_UI_Shell",
    "Win32_System_Pipes",
    "Win32_System_SystemServices",
    "Win32_System_Environment",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Wdk_Foundation",
    "Wdk_Storage_FileSystem",
] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
# Self-signed certificates for the TLS tests (TASK-035).
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "pem"] }

# The supervisor e2e test stops the supervisor with Ctrl+Break
# (GenerateConsoleCtrlEvent).
[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console"] }

# The TASK-018 soak runs its own main: it re-executes itself as the Claude
# Code stand-in and skips unless asked (`-- --ignored`).
[[test]]
name = "soak"
harness = false

# The TASK-026 supervisor test runs its own main: a copy of it is the
# candidate whose hub exits at once.
[[test]]
name = "supervise_e2e"
harness = false

# The TASK-040 `cctg run` test runs its own main: it is also the claude
# stand-in that `cctg run` starts.
[[test]]
name = "run_e2e"
harness = false

# The TASK-077 compressor test runs its own main: the test binary is also the
# helper claude stand-in (started with `--safe-mode`).
[[test]]
name = "compress_e2e"
harness = false

# The TASK-044 test of `cctg run` in a terminal (Linux, macOS): it is also
# the claude stand-in in the pseudo-terminal.
[[test]]
name = "run_pty_e2e"
harness = false

# The TASK-085 voice test runs its own main: the test binary is also the
# `cctg-voice` stand-in (started with the model folder alone).
[[test]]
name = "voice_e2e"
harness = false
