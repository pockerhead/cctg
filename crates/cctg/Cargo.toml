[package]
name = "cctg"
version = "0.1.0"
edition.workspace = true

[dependencies]
anyhow.workspace = true
clap.workspace = true
dotenvy.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
subtle.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-std", "io-util", "net", "process", "signal", "sync", "time"] }
tracing.workspace = true
tracing-subscriber.workspace = true
transcript = { path = "../transcript" }

# Process snapshot for the hook's nesting check (CreateToolhelp32Snapshot).
# Already in the lock file through tokio; no new download.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

# The supervisor e2e test stops the supervisor with Ctrl+Break
# (GenerateConsoleCtrlEvent).
[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console"] }

# The TASK-018 soak runs its own main: it re-executes itself as the Claude
# Code stand-in and skips unless asked (`-- --ignored`).
[[test]]
name = "soak"
harness = false

# The TASK-026 supervisor test runs its own main: a copy of it is the
# candidate whose hub exits at once.
[[test]]
name = "supervise_e2e"
harness = false
