# Publishing (TASK-035). A push to main: the hub image as :main and
# :sha-<commit>. A tag v*: the image as :<version> and :latest, and the
# client binaries (Windows x86_64, static Linux x86_64, macOS arm64) in a
# GitHub Release. Image and binaries of one run are built with the same
# CCTG_BUILD_ID, so a hub and a client of one commit report the same build.
# Tag only a commit whose `ci` run is green and whose install.sh says
# RELEASE=<the tag>. Only GITHUB_TOKEN; no other secret. Actions are pinned
# to commits.
name: release

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.95.0"
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # install.sh of a tag installs the binaries of that tag (TASK-031):
      # its RELEASE line must name this tag, or nothing is published.
      - name: install.sh belongs to this tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if ! grep -qxF "RELEASE=${GITHUB_REF_NAME}" install.sh; then
            echo "::error::install.sh has no RELEASE=${GITHUB_REF_NAME}"
            exit 1
          fi
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha,format=long
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: CCTG_BUILD_ID=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: static Linux binary from the same build stage
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: binary
          outputs: type=local,dest=dist
          build-args: CCTG_BUILD_ID=${{ github.sha }}
          cache-from: type=gha
      - if: startsWith(github.ref, 'refs/tags/v')
        run: mv dist/cctg "dist/cctg-${GITHUB_REF_NAME}-x86_64-unknown-linux-musl"
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux
          path: dist/

  client:
    if: startsWith(github.ref, 'refs/tags/v')
    name: client (${{ matrix.target }})
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: .exe
          - os: macos-14
            target: aarch64-apple-darwin
            suffix: ""
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: toolchain
        shell: bash
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target "${{ matrix.target }}"
          rustup default "$RUST_TOOLCHAIN"
      - name: build
        shell: bash
        env:
          CCTG_BUILD_ID: ${{ github.sha }}
        run: cargo build --release --locked -p cctg --target "${{ matrix.target }}"
      - name: the binary carries this commit
        shell: bash
        run: |
          bin="target/${{ matrix.target }}/release/cctg${{ matrix.suffix }}"
          "$bin" --version | grep -F "${{ github.sha }}"
          mkdir dist
          cp "$bin" "dist/cctg-${GITHUB_REF_NAME}-${{ matrix.target }}${{ matrix.suffix }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: client-${{ matrix.target }}
          path: dist/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [image, client]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: checksums
        run: cd dist && sha256sum cctg-* > SHA256SUMS
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/*
          --repo "$GITHUB_REPOSITORY"
          --title "$GITHUB_REF_NAME"
          --notes "Commit ${GITHUB_SHA}. Hub image: ${IMAGE}:${GITHUB_REF_NAME#v}"
