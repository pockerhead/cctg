# Every push and pull request: format, lints and all tests of the workspace
# on Linux, Windows and macOS (install.sh end to end included, TASK-031),
# shellcheck of install.sh; the hub image builds (not pushed) and passes
# the container smoke (.github/smoke). Actions are pinned to commits; the
# toolchain comes from the runner's rustup. No secret is used.
name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.95.0"
  # Tests publish the debug cctg as a release (update_e2e): with debug info
  # it outgrew the 64 MiB download cap on Linux (TASK-024).
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: toolchain
        shell: bash
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt,clippy
          rustup default "$RUST_TOOLCHAIN"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: fmt
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check
      - name: shellcheck install.sh
        if: runner.os == 'Linux'
        run: shellcheck --shell=sh install.sh
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: test
        run: cargo test --workspace --locked --no-fail-fast
      # The voice recognition helper of the hub image (TASK-085): its own
      # workspace, linked with the static sherpa-onnx libraries (Linux only),
      # the archive checked like in the Dockerfile.
      - name: voice helper
        if: runner.os == 'Linux'
        shell: bash
        env:
          SHERPA_ONNX_ARCHIVE_DIR: ${{ runner.temp }}/sherpa
        run: |
          archive=sherpa-onnx-v1.13.8-linux-x64-static-lib.tar.bz2
          mkdir -p "$SHERPA_ONNX_ARCHIVE_DIR"
          curl -fsSL -o "$SHERPA_ONNX_ARCHIVE_DIR/$archive" \
            "https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.8/$archive"
          echo "e1fdc5b67530e15741ef897fa5ffff297056f3bf0c6d829a27af9225a4c4b5a6  $SHERPA_ONNX_ARCHIVE_DIR/$archive" | sha256sum -c -
          cargo fmt --manifest-path crates/voice/Cargo.toml -- --check
          cargo clippy --manifest-path crates/voice/Cargo.toml --all-targets --locked -- -D warnings
          cargo test --manifest-path crates/voice/Cargo.toml --locked

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: cctg:smoke
          build-args: CCTG_BUILD_ID=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: a client of the same commit (other bytes than the image's)
        env:
          CCTG_BUILD_ID: ${{ github.sha }}
        run: cargo build --locked -p cctg
      - name: container smoke
        run: python3 .github/smoke/smoke.py cctg:smoke target/debug/cctg "${{ github.sha }}"
      # TASK-085: the image size, the helper's and the model's sizes, and the
      # helper's own numbers on the fixture (a cached build log has none).
      # TASK-086: the fixture twice to one helper process (a request is the
      # byte count on a line, then the bytes); both answers need the words.
      - name: image size and voice helper numbers
        run: |
          docker image inspect cctg:smoke --format 'image size: {{.Size}} bytes'
          docker run --rm --entrypoint sh cctg:smoke -c \
            'ls -l /usr/local/bin/cctg /usr/local/bin/cctg-voice && du -sh /usr/local/share/cctg/voice-ru'
          fixture=crates/voice/tests/fixtures/voice-ru.ogg
          size=$(stat -c %s "$fixture")
          heard=$({ printf '%s\n' "$size"; cat "$fixture"; printf '%s\n' "$size"; cat "$fixture"; } \
            | docker run --rm -i --entrypoint cctg-voice cctg:smoke /usr/local/share/cctg/voice-ru)
          echo "$heard"
          test "$(grep -c 'запусти тесты' <<< "$heard")" -eq 2
          test "$(wc -l <<< "$heard")" -eq 2
