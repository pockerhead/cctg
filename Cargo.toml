[workspace]
members = ["crates/cctg", "crates/transcript"]
resolver = "3"

[workspace.package]
edition = "2024"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
dotenvy = "0.15"
reqwest = { version = "0.13", default-features = false, features = ["json", "multipart", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tracing = "0.1"
tracing-subscriber = "0.3"
unicode-segmentation = "1.13.3"

# Keep line-level backtraces but drop full debug info: linking test binaries
# with full debuginfo peaked at 5-6 GB in rust-lld on this host.
[profile.dev]
debug = "line-tables-only"
